
name: Daily Steam Price Collection

on:
  schedule:
    - cron: "47 23 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-steam-price-collection
  cancel-in-progress: false

jobs:
  collect-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      STEAMLENS_BASE_URL: ${{ vars.STEAMLENS_BASE_URL }}
      COLLECTOR_ADMIN_KEY: ${{ secrets.COLLECTOR_ADMIN_KEY }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$STEAMLENS_BASE_URL" ]]; then
            echo "::error::Missing repository variable STEAMLENS_BASE_URL"
            exit 1
          fi

          if [[ -z "$COLLECTOR_ADMIN_KEY" ]]; then
            echo "::error::Missing repository secret COLLECTOR_ADMIN_KEY"
            exit 1
          fi

          if [[ "$STEAMLENS_BASE_URL" != https://* ]]; then
            echo "::error::Backend URL must use HTTPS"
            exit 1
          fi

          echo "Configuration validated."

      - name: Wake backend and verify database
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${STEAMLENS_BASE_URL%/}"

          for attempt in $(seq 1 12); do
            response=$(curl -sS \
              --connect-timeout 10 \
              --max-time 15 \
              "$BASE_URL/api/health" 2>/dev/null || true)

            if [[ -n "$response" ]] &&
               echo "$response" | jq -e \
               '.status == "ok" and .database == "connected"' >/dev/null 2>&1; then
              echo "Backend is ready. Neon database is connected."
              exit 0
            fi

            echo "Backend not ready. Attempt $attempt/12. Waiting 15 seconds..."
            sleep 15
          done

          echo "::error::Backend did not become ready within the retry window."
          exit 1

      - name: Run Steam price collector
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${STEAMLENS_BASE_URL%/}"
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_CODE=$(curl -sS \
            --connect-timeout 15 \
            --max-time 280 \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            -H "x-collector-admin-key: $COLLECTOR_ADMIN_KEY" \
            "$BASE_URL/api/collector/run" || true)

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Price collector failed. HTTP status: ${HTTP_CODE:-no response}"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Price collector completed. HTTP $HTTP_CODE"

          if jq -e . "$RESPONSE_FILE" >/dev/null 2>&1; then
            jq . "$RESPONSE_FILE"
          else
            cat "$RESPONSE_FILE"
          fi

